# The contributor agreement (CLA.md): a pull request from someone who has not signed it gets a comment asking
# them to sign by replying with the sentence below. Signatures are kept in this repository, on the
# cla-signatures branch. The action does not run any code from the pull request.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: contributor agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/kristiandroste/baabaa/blob/main/CLA.md
          branch: cla-signatures
          allowlist: kristiandroste,dependabot[bot]
