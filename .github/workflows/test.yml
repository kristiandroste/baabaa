# The tests on Linux and on a Mac with Apple silicon. No GPU here: Ollama and model servers are stand-ins
# (tests/fixtures), and `baabaa doctor --sandbox` checks the tool sandbox on each system. The Mac runs one Python
# version: Mac minutes count tenfold against a private repository's free allowance.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: macos-15, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: tests
        run: python -m unittest discover -s tests
      # the next two run even when a test failed: each reports on its own
      - name: the tool sandbox on this system
        if: ${{ !cancelled() }}
        run: BAABAA_HOME="$RUNNER_TEMP/baabaa" python -m baabaa doctor --sandbox
      - name: renderer tests
        if: ${{ !cancelled() }}
        run: for t in tests/js/*.test.mjs; do node "$t"; done
